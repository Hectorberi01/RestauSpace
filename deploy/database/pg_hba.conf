# TYPE   BASE           UTILISATEUR                            ADRESSE           MÉTHODE
# Local au conteneur (sondes, maintenance).
local    all            all                                                      trust
host     all            all                                    127.0.0.1/32      scram-sha-256
# Serveur applicatif, sur le réseau privé : TLS, la base de l'application et ses deux comptes seulement (jamais le
# superutilisateur). Encore plus strict : l'IP privée du serveur applicatif en /32 au lieu du /24.
hostssl  es_restaurant  es_restaurant_user,es_restaurant_app   10.10.0.0/24      scram-sha-256
# Réseau Docker de ce projet (docker-compose.yml) : le conteneur de sauvegarde, en TLS.
hostssl  es_restaurant  postgres                               172.30.240.0/28   scram-sha-256
# Tout le reste, dont les connexions non chiffrées et le superutilisateur à distance, est refusé.
