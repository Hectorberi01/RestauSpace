# TYPE   BASE  UTILISATEUR  ADRESSE        MÉTHODE
# Local au conteneur (sondes, maintenance).
local    all   all                         trust
host     all   all          127.0.0.1/32   scram-sha-256
# Réseau privé entre serveurs (10.10.0.0/24) : TLS obligatoire, mot de passe SCRAM.
# Encore plus strict : l'IP privée du serveur applicatif en /32.
hostssl  all   all          10.10.0.0/24   scram-sha-256
# Réseau Docker de ce projet (docker-compose.yml) : le conteneur de sauvegarde, en TLS.
hostssl  all   all          172.30.240.0/28  scram-sha-256
# Tout le reste, dont les connexions non chiffrées, est refusé.
