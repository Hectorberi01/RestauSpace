# Serveur de base de données : PostgreSQL seul, joignable par le serveur applicatif en TLS (connexions non chiffrées
# refusées par pg_hba.conf), sur le réseau privé 10.10.0.0/24 seulement.
#   cp .env.example .env && chmod 600 .env && ./make-cert.sh && docker compose up -d
# Inutile si PostgreSQL est déjà installé sur ce serveur : appliquer seulement pg_hba.conf, le TLS et init.sql.
name: saasrestaurant-db

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-1000}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saasrestaurant}
      POSTGRES_USER: ${POSTGRES_USER:-saasrestaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      # Adresse d'écoute : l'IP privée du serveur si l'hébergeur en fournit une, sinon 0.0.0.0 (pare-feu obligatoire).
      - "${BIND_ADDRESS:-10.10.0.2}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./tls:/etc/postgresql/tls:ro
      - ./init.sql:/docker-entrypoint-initdb.d/10-monitoring.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # Sauvegarde quotidienne (pg_dump), BACKUP_RETENTION_DAYS jours dans BACKUP_DIR. En garder une copie hors du serveur (R2).
  backup:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-saasrestaurant}
      PGUSER: ${POSTGRES_USER:-saasrestaurant}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: require
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

# Sous-réseau fixe : pg_hba.conf n'y autorise que la sauvegarde (TLS + mot de passe).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.240.0/28

volumes:
  postgres-data:
