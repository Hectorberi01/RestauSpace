<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Paiement de démonstration</title>
<style>
  :root{--brand:#5b3df5;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#168449}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f2fb;font-family:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;color:var(--ink);padding:16px}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px #0f172a14;overflow:hidden}
  .demo{background:#fff7e8;color:#8a5a0b;font-size:13px;padding:10px 18px;border-bottom:1px solid #fbe3b6}
  .body{padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
  .methods{display:grid;gap:10px;margin:20px 0}
  label.method{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:600}
  label.method:has(input:checked){border-color:var(--brand);background:#f6f4ff}
  label.method small{display:block;font-weight:400;color:var(--muted)}
  input[type=radio]{accent-color:var(--brand);width:18px;height:18px}
  button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
  .pay{background:var(--brand);color:#fff}
  .pay:disabled{opacity:.6;cursor:wait}
  .cancel{background:transparent;color:var(--muted);margin-top:8px}
  .error{display:none;margin-top:12px;background:#fef2f2;color:#a33a3a;border-radius:10px;padding:10px 12px;font-size:14px}
  .ref{margin-top:16px;font-size:12px;color:#94a3b8;word-break:break-all}
</style>
</head>
<body>
<main class="card">
  <div class="demo">Démonstration : aucun argent n’est débité, aucune donnée bancaire n’est demandée.</div>
  <div class="body">
    <h1>Paiement en ligne</h1>
    <p>Sur le vrai site, le client paie ici chez le prestataire du restaurant (Mobile Money ou carte). Dans la démo, le paiement est simulé.</p>
    <div class="methods" role="radiogroup" aria-label="Moyen de paiement">
      <label class="method"><input type="radio" name="method" value="momo" checked><span>Mobile Money<small>MTN MoMo, Moov Money</small></span></label>
      <label class="method"><input type="radio" name="method" value="card"><span>Carte bancaire<small>Visa, Mastercard</small></span></label>
    </div>
    <button class="pay" id="pay" type="button">Payer (démo)</button>
    <button class="cancel" id="cancel" type="button">Annuler et revenir à la commande</button>
    <div class="error" id="error" role="alert"></div>
    <div class="ref" id="ref"></div>
  </div>
</main>
<script>
  // Référence du paiement : dernier segment de l'adresse (…/paiement-demo/<référence>).
  const reference = decodeURIComponent(location.pathname.replace(/\/+$/, '').split('/').pop() || '');
  let context = null;
  try { context = JSON.parse(sessionStorage.getItem('restauspace-demo-payment') || 'null'); } catch (e) { context = null; }
  const error = document.getElementById('error');
  const pay = document.getElementById('pay');
  document.getElementById('ref').textContent = reference && reference !== 'paiement-demo' ? 'Référence : ' + reference : '';
  const fail = (text) => { error.textContent = text; error.style.display = 'block'; pay.disabled = false; pay.textContent = 'Payer (démo)'; };
  // Retour seulement vers une page de démo de la même origine.
  const back = () => {
    const url = context && typeof context.returnUrl === 'string' ? context.returnUrl : '/';
    location.replace(url.startsWith(location.origin + '/') ? url : '/');
  };
  document.getElementById('cancel').addEventListener('click', back);
  pay.addEventListener('click', async () => {
    if (!context || !context.apiUrl || !context.publishableKey || !reference || reference === 'paiement-demo') {
      fail('Session de démonstration introuvable : repassez la commande depuis la démo.');
      return;
    }
    pay.disabled = true;
    pay.textContent = 'Paiement en cours…';
    try {
      const response = await fetch(context.apiUrl.replace(/\/+$/, '') + '/v1/storefront/demo/payments/' + encodeURIComponent(reference) + '/capture', {
        method: 'POST',
        headers: {'X-Storefront-Key': context.publishableKey, 'Accept': 'application/json'},
      });
      if (!response.ok) {
        fail('Le paiement de démonstration n’a pas abouti (' + response.status + '). Réessayez.');
        return;
      }
      setTimeout(back, 600);
      pay.textContent = 'Paiement accepté';
    } catch (e) {
      fail('Connexion impossible. Vérifiez votre réseau et réessayez.');
    }
  });
</script>
</body>
</html>
