# Démos des modèles : fichiers statiques, un dossier par modèle.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Affichable seulement dans les pages de restauspace.com (fiche du modèle).
    add_header Content-Security-Policy "frame-ancestors 'self' https://restauspace.com https://www.restauspace.com" always;
    add_header X-Robots-Tag "noindex" always;

    location = /healthz { access_log off; return 200 "ok"; }

    # Page de paiement simulé : …/paiement-demo/<référence>.
    location /paiement-demo/ {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://restauspace.com https://www.restauspace.com" always;
        try_files /paiement-demo/index.html =404;
    }

    location ~ ^/[^/]+/_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /index.html;
}
